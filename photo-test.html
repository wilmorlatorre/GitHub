<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Messenger...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      max-width: 380px;
      width: 100%;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0084ff;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #111;
    }
    p {
      color: #666;
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #0084ff;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h2>Opening Messenger...</h2>
    <p>Please wait a moment while we redirect you. If nothing happens, tap the button below:</p>
    <a id="btnRedirect" class="btn" href="#">Continue to Messenger</a>
  </div>

  <script>
    // Configuration matching your ManyChat Ref URL trigger
    const PAGE_ID = "connectone";
    const BASE_REF = "wilms";

    // 1. Read parameter 'p' from the URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const photoValue = urlParams.get('p') || urlParams.get('photo') || '';

    // 2. Build the m.me URL with the ManyChat double-hyphen payload format
    let targetUrl = `https://m.me/${PAGE_ID}?ref=${BASE_REF}`;
    if (photoValue) {
      targetUrl += `--${encodeURIComponent(photoValue)}`;
    }

    // 3. Fallback button link
    const actionBtn = document.getElementById('btnRedirect');
    actionBtn.href = targetUrl;

    // 4. Instant browser redirect to Messenger
    window.location.replace(targetUrl);
  </script>

</body>
</html>
