<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow Playing and Running</title>
  <!-- Vimeo Player JS SDK -->
  <script src="https://player.vimeo.com/api/player.js"></script>
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border: #e2e8f0;
      --radius: 14px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 2.5rem 1.25rem 4rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    /* Video Card & 16:9 Responsive Wrapper */
    .video-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }

    .video-responsive {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      background: #000000;
    }

    .video-responsive iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Controls & Progress Bar Row */
    .player-controls-bar {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background: var(--bg-surface);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.2s ease-out;
    }

    .progress-label {
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 90px;
      text-align: right;
    }

    .fullscreen-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .fullscreen-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .fullscreen-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Snow Playing and Running</h1>
    </header>

    <!-- Responsive Video Embed Card -->
    <section class="video-card" aria-label="Snow Playing and Running Video Player">
      <div class="video-responsive" id="video-container">
        <!-- Vimeo Video ID: 1237405734 -->
        <iframe
          id="vimeo-player"
          src="https://player.vimeo.com/video/1237405734?title=0&byline=0&portrait=0&fullscreen=1"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
          allowfullscreen
          webkitallowfullscreen
          mozallowfullscreen
          title="Snow Playing and Running">
        </iframe>
      </div>

      <div class="player-controls-bar">
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-label" id="progress-label">0.0% (0:00)</div>
        <button type="button" class="fullscreen-btn" id="fullscreen-toggle-btn" aria-label="Toggle Fullscreen">
          <span aria-hidden="true">⛶</span>
          <span id="fullscreen-btn-text">Fullscreen</span>
        </button>
      </div>
    </section>
  </div>

  <script>
    const iframe = document.getElementById('vimeo-player');
    const videoContainer = document.getElementById('video-container');
    const player = new Vimeo.Player(iframe);

    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const fullscreenBtn = document.getElementById('fullscreen-toggle-btn');
    const fullscreenBtnText = document.getElementById('fullscreen-btn-text');

    function formatSeconds(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const mins = Math.floor(s / 60);
      const rem = s % 60;
      return `${mins}:${rem < 10 ? '0' : ''}${rem}`;
    }

    player.on('timeupdate', (data) => {
      const pct = (data.percent || 0) * 100;
      progressFill.style.width = `${Math.min(100, pct).toFixed(1)}%`;
      progressLabel.textContent = `${pct.toFixed(1)}% (${formatSeconds(data.seconds)})`;
    });

    player.on('ended', (data) => {
      progressFill.style.width = '100%';
      progressLabel.textContent = `100.0% (${formatSeconds(data.duration)})`;
    });

    // Fullscreen Toggle & Sync
    function updateFullscreenUI(isFullscreen) {
      if (fullscreenBtnText) {
        fullscreenBtnText.textContent = isFullscreen ? 'Exit Fullscreen' : 'Fullscreen';
      }
    }

    player.on('fullscreenchange', (data) => {
      updateFullscreenUI(data.fullscreen);
    });

    document.addEventListener('fullscreenchange', () => {
      updateFullscreenUI(Boolean(document.fullscreenElement));
    });

    fullscreenBtn.addEventListener('click', () => {
      player.getFullscreen().then((isFullscreen) => {
        if (isFullscreen) {
          return player.exitFullscreen();
        } else {
          return player.requestFullscreen();
        }
      }).catch(() => {
        // Fallback to native Fullscreen API if Vimeo iframe delegates fullscreen
        const target = iframe.requestFullscreen ? iframe : videoContainer;
        if (!document.fullscreenElement) {
          target.requestFullscreen?.();
        } else {
          document.exitFullscreen?.();
        }
      });
    });
  </script>
</body>
</html>
